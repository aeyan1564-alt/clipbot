
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipbot - TikTok Connection</title>
</head>
<body>
  <h2>Clipbot TikTok Connection</h2>
  <p id="status">Checking TikTok authorization...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");

    if (error) {
      document.getElementById("status").textContent =
        "TikTok authorization failed: " + error;
    } else if (code) {
      document.getElementById("status").textContent =
        "TikTok authorization received. Return to Clipbot to finish connecting.";
    } else {
      document.getElementById("status").textContent =
        "Clipbot callback page is ready.";
    }
  </script>
</body>
</html>
